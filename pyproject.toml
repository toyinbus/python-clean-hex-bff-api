[project]
name = "python-clean-hex-bff-api"
version = "1.0.0"
description = "Generic FastAPI BFF (Backend-for-Frontend) — CleanHex (Clean + Hexagonal) reference service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
